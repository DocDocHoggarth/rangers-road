<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Ranger's Road</title>
<meta name="description" content="A personal training journal that walks you from Hobbiton to the Black Gate.">
<meta name="theme-color" content="#DCC79B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ranger's Road">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<script>
/* Choose the theme before the first paint, so a candlelight evening never flashes daylight. */
try {
  var t = (JSON.parse(localStorage.getItem('rangers-road-v1')) || {}).settings || {};
  var dark = t.theme === 'dark' || (t.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
} catch (e) { /* daylight */ }
</script>
</head>
<body>
<div id="app"><main id="view" aria-live="polite"></main></div>

<nav id="tabs" aria-label="Sections">
  <div class="in">
    <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20l9-15 9 15zM12 5v15M9 20l3-5 3 5"/></svg>Today</button>
    <button data-tab="road"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 21c5-3-4-6 2-9s-3-5 3-9" stroke-dasharray="3 3"/><circle cx="17" cy="6" r="2.5"/></svg>Road</button>
    <button data-tab="ranger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2 7 7 2-7 2-2 7-2-7-7-2 7-2z"/></svg>Ranger</button>
    <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5zM9 9h6M9 13h6M9 17h4"/></svg>Journal</button>
  </div>
</nav>

<div id="scrim" hidden><div id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<div id="toast" role="status" hidden></div>

<script src="art.js"></script>
<script src="scenes.js"></script>
<script src="data.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
